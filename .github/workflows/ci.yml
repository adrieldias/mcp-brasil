name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore McpBrasil.slnx

      - name: Compilar
        run: dotnet build McpBrasil.slnx --no-restore -c Release

      - name: Testar
        run: dotnet test McpBrasil.slnx --no-build -c Release
